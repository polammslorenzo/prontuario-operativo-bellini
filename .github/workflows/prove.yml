name: Prove motore orario

on:
  push:
  pull_request:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove automatiche (fuso orario italiano)
        run: npm test
        env:
          TZ: Europe/Rome
